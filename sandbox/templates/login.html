{% extends 'base.html' %}

{% block title %}Sandbox - Login{% endblock %}

{% block content %}
<div class="max-w-md mx-auto bg-slate-900/80 border border-slate-800 rounded-2xl p-8 shadow-xl">
  <div class="text-center mb-6">
    <h2 class="text-2xl font-bold text-white">Welcome Back</h2>
    <p class="text-slate-400 text-sm mt-1">Enter your credentials to access your account</p>
  </div>

  <form method="POST" action="/login/" class="space-y-4">
    {% csrf_token %}
    <div>
      <label class="block text-sm font-medium text-slate-300 mb-1">Username</label>
      <input type="text" name="username" required placeholder="yourusername" 
             class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-2.5 text-white focus:outline-none focus:border-indigo-500">
    </div>

    <div>
      <label class="block text-sm font-medium text-slate-300 mb-1">Password</label>
      <input type="password" name="password" required placeholder="••••••••" 
             class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-2.5 text-white focus:outline-none focus:border-indigo-500">
    </div>

    <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-3 rounded-lg transition-all shadow-lg shadow-indigo-600/30">
      Sign In
    </button>
  </form>

  <p class="text-slate-400 text-xs text-center mt-6">
    Don't have an account? <a href="/signup/" class="text-indigo-400 hover:underline">Sign up</a>
  </p>
</div>
{% endblock %}
