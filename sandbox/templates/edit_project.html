{% extends 'base.html' %}

{% block title %}Edit Project - {{ project.title }}{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto bg-slate-900/80 border border-slate-800 rounded-2xl p-8 shadow-xl">
  <h2 class="text-2xl font-bold text-white mb-2 flex items-center gap-2">
    <i data-lucide="edit-3" class="w-6 h-6 text-indigo-400"></i> Edit Project Details
  </h2>
  <p class="text-slate-400 text-sm mb-6">Update your project overview and demo link.</p>

  <form method="POST" action="/project/{{ project.id }}/edit/" class="space-y-5">
    {% csrf_token %}
    <div>
      <label class="block text-sm font-medium text-slate-300 mb-1">Project Title</label>
      <input type="text" name="title" value="{{ project.title }}" required 
             class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-2.5 text-white focus:outline-none focus:border-indigo-500">
    </div>

    <div>
      <label class="block text-sm font-medium text-slate-300 mb-1">Description / Context</label>
      <textarea name="description" rows="6" required 
                class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-2.5 text-white focus:outline-none focus:border-indigo-500">{{ project.description }}</textarea>
      <p class="text-xs text-slate-500 mt-1">Tip: Provide key tech stack details and features for clearer context.</p>
    </div>

    <div>
      <label class="block text-sm font-medium text-slate-300 mb-1">Working Demo / GitHub Link</label>
      <input type="url" name="link" value="{{ project.link|default:'' }}" placeholder="https://github.com/username/repo" 
             class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-2.5 text-white focus:outline-none focus:border-indigo-500">
    </div>

    <div class="flex gap-4">
      <a href="/project/{{ project.id }}/" class="w-1/3 text-center bg-slate-800 hover:bg-slate-700 text-slate-300 font-semibold py-3 rounded-lg transition-all">Cancel</a>
      <button type="submit" class="w-2/3 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-3 rounded-lg transition-all shadow-lg shadow-indigo-600/30">
        Save Changes
      </button>
    </div>
  </form>
</div>
<div>
  <label class="block text-sm font-medium text-slate-300 mb-1">Tech Stack (comma separated)</label>
  <input type="text" name="tech_stack" value="{{ project.tech_stack|default:'' }}" placeholder="e.g. React, CesiumJS, Tailwind, Django" 
         class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-2.5 text-white focus:outline-none focus:border-indigo-500">
</div>
{% endblock %}
