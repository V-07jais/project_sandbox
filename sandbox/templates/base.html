<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950 text-slate-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Sandbox{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="flex flex-col min-h-screen bg-slate-950 text-slate-100 selection:bg-indigo-500 selection:text-white">

  <!-- Navbar -->
  <nav class="sticky top-0 z-50 backdrop-blur-md bg-slate-900/80 border-b border-slate-800/80">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-16">
        <a href="/" class="flex items-center gap-2 font-bold text-xl tracking-tight text-white">
          <span class="p-1.5 bg-indigo-600 rounded-lg text-white">
            <i data-lucide="layers" class="w-5 h-5"></i>
          </span>
          Sandbox
        </a>
        
        <div class="flex items-center gap-6 text-sm font-medium">
          <a href="/" class="text-slate-300 hover:text-white transition-colors">Home</a>
          <a href="/projects/" class="text-slate-300 hover:text-white transition-colors">Projects</a>
          
          {% if user.is_authenticated %}
            <a href="/profile/" class="text-slate-300 hover:text-white transition-colors">@{{ user.username }}</a>
            <a href="/logout/" class="px-3 py-1.5 rounded-lg border border-slate-700 hover:bg-slate-800 text-slate-300 transition-all">Logout</a>
          {% else %}
            <a href="/login/" class="text-slate-300 hover:text-white transition-colors">Login</a>
            <a href="/signup/" class="px-4 py-2 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white font-semibold transition-all shadow-lg shadow-indigo-600/30">Sign Up</a>
          {% endif %}
        </div>
      </div>
    </div>
  </nav>

  <!-- Flash Messages -->
  {% if messages %}
    <div class="max-w-7xl mx-auto px-4 mt-4 w-full">
      {% for message in messages %}
        <div class="p-4 rounded-xl text-sm font-medium mb-2 border {% if message.tags == 'error' %}bg-rose-500/10 border-rose-500/30 text-rose-400{% else %}bg-emerald-500/10 border-emerald-500/30 text-emerald-400{% endif %}">
          {{ message }}
        </div>
      {% endfor %}
    </div>
  {% endif %}

  <!-- Main Content -->
  <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-10">
    {% block content %}{% endblock %}
  </main>

  <footer class="bg-slate-900/50 border-t border-slate-800/60 py-6 text-center text-slate-400 text-sm">
    <p>&copy; {% now "Y" %} Sandbox Platform. Crafted for builders.</p>
  </footer>

  <script>
    lucide.createIcons();
  </script>
</body>
</html>
