{% extends 'base.html' %}

{% block title %}Sandbox - Add New Project{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto bg-slate-900/80 border border-slate-800 rounded-2xl p-8 shadow-xl">
  <h2 class="text-2xl font-bold text-white mb-2 flex items-center gap-2">
    <i data-lucide="plus-circle" class="w-6 h-6 text-indigo-400"></i> Add New Project
  </h2>
  <p class="text-slate-400 text-sm mb-6">This project will be linked to your profile and visible in the community feed.</p>

  <form method="POST" action="/add-project/" class="space-y-5">
    {% csrf_token %}
    <div>
      <label class="block text-sm font-medium text-slate-300 mb-1">Project Title</label>
      <input type="text" name="title" required placeholder="e.g., Interactive 3D Mapping App" 
             class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-2.5 text-white focus:outline-none focus:border-indigo-500">
    </div>

    <div>
      <label class="block text-sm font-medium text-slate-300 mb-1">Description</label>
      <textarea name="description" rows="4" required placeholder="Briefly describe what you built..." 
                class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-2.5 text-white focus:outline-none focus:border-indigo-500"></textarea>
    </div>

    <div>
      <label class="block text-sm font-medium text-slate-300 mb-1">Project URL (Optional)</label>
      <input type="url" name="link" placeholder="https://github.com/your-username/project" 
             class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-2.5 text-white focus:outline-none focus:border-indigo-500">
    </div>

    <div class="flex gap-4">
      <a href="/profile/" class="w-1/3 text-center bg-slate-800 hover:bg-slate-700 text-slate-300 font-semibold py-3 rounded-lg transition-all">Cancel</a>
      <button type="submit" class="w-2/3 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-3 rounded-lg transition-all shadow-lg shadow-indigo-600/30">
        Publish Project
      </button>
    </div>
  </form>
</div>
<div>
  <label class="block text-sm font-medium text-slate-300 mb-1">Tech Stack (comma separated)</label>
  <input type="text" name="tech_stack" placeholder="e.g. React, CesiumJS, Tailwind, Django" 
         class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-2.5 text-white focus:outline-none focus:border-indigo-500">
</div>
{% endblock %}
